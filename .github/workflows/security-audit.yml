name: Security audit

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - run: pnpm audit --prod --audit-level high
