name: Sync Data

on:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm sync
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
